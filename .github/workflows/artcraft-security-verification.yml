name: ArtCraft security verification

on:
  push:
    branches: ['codex/security-verification-*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.app }}
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        # Focused follow-ups preserve the other immutable candidate runs.
        app: ${{ contains(github.event.head_commit.message, '[verify:codecs]') && fromJSON('["effectcraft","filmcraft"]') || contains(github.event.head_commit.message, '[verify:pdfcraft]') && fromJSON('["pdfcraft"]') || contains(github.event.head_commit.message, '[verify:soundcraft]') && fromJSON('["soundcraft"]') || contains(github.event.head_commit.message, '[verify:lightcraft]') && fromJSON('["lightcraft"]') || fromJSON('["cadcraft","gridcraft","soundcraft","deckcraft","vectorcraft","designcraft","effectcraft","filmcraft","lightcraft","wordcraft","pdfcraft","craft-launcher"]') }}
    env:
      APP: ${{ matrix.app }}
      VERIFY_COMMIT: ${{ github.sha }}
      VERIFY_REPOSITORY: ${{ github.repository }}
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # Verification uses opt-level=3 and thin-local LTO; all repository tests and gates run.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the verified Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.97.1
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/target" >> $env:GITHUB_ENV
      - name: Install PDF dependency checker
        if: matrix.app == 'pdfcraft'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Install maintained DirectX shader compiler
        if: matrix.app == 'filmcraft' || matrix.app == 'effectcraft'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'dxc'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1') { throw 'DXC release checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $bin = Join-Path $tools 'bin/x64'
          foreach ($name in @('dxc.exe','dxcompiler.dll','dxil.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path $bin $name))) { throw "Missing shader compiler dependency: $name" }
          }
          & (Join-Path $bin 'dxc.exe') --version
          $bin >> $env:GITHUB_PATH
          "DXC_TOOL_DIR=$bin" >> $env:GITHUB_ENV
          "VERIFY_DXC_RELEASE=v1.9.2609" >> $env:GITHUB_ENV
          "VERIFY_DXC_SHA=$digest" >> $env:GITHUB_ENV
      - name: Apply the exact candidate to its original source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Join-Path $env:RUNNER_TEMP 'source'
          if ($env:APP -eq 'craft-launcher') {
            $repository = "https://github.com/$env:VERIFY_REPOSITORY.git"
            $base = $env:VERIFY_COMMIT
          } else {
            $manifest = Get-Content security-verification/patches/manifest.json -Raw | ConvertFrom-Json
            $row = @($manifest | Where-Object { $_.repository -eq $env:APP })
            if ($row.Count -ne 1) { throw 'Expected exactly one source manifest entry' }
            $row = $row[0]
            $base = $row.baseCommit
            $repository = "https://github.com/storytold/$env:APP.git"
            $patch = Join-Path $env:GITHUB_WORKSPACE "security-verification/patches/$env:APP.patch"
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $patch).Hash.ToLowerInvariant()
            if ($digest -ne $row.sha256) { throw 'Candidate patch checksum mismatch' }
          }
          if ($base -notmatch '^[0-9a-f]{40}$') { throw 'Invalid immutable source revision' }
          git init $source
          git -C $source config core.autocrlf false
          git -C $source remote add origin $repository
          git -C $source fetch --depth=1 origin $base
          git -C $source checkout --detach FETCH_HEAD
          if ($env:APP -ne 'craft-launcher') {
            git -C $source apply --check $patch
            git -C $source apply $patch
            git -C $source diff --check
          }
          "VERIFY_SOURCE=$source" >> $env:GITHUB_ENV
          "VERIFY_BASE=$base" >> $env:GITHUB_ENV
          if ($env:APP -ne 'craft-launcher') { "VERIFY_PATCH_SHA=$digest" >> $env:GITHUB_ENV }
      - name: Run all required repository checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location -LiteralPath $env:VERIFY_SOURCE
          $log = Join-Path $env:RUNNER_TEMP 'ci.log'
          cargo xtask ci 2>&1 | Tee-Object -FilePath $log
          $result = $LASTEXITCODE
          $record = [ordered]@{
            repository = $env:APP
            baseCommit = $env:VERIFY_BASE
            verificationCommit = $env:VERIFY_COMMIT
            patchSHA256 = $env:VERIFY_PATCH_SHA
            command = @('cargo', 'xtask', 'ci')
            exitCode = $result
            debugSymbols = $false
            compilationJobs = 4
            releaseCodegenUnits = 16
            releaseLTO = 'false'
            shaderCompilerRelease = $env:VERIFY_DXC_RELEASE
            shaderCompilerArchiveSHA256 = $env:VERIFY_DXC_SHA
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'result.json')
          if ($result -ne 0) { throw "Repository CI failed with exit code $result" }
      - name: Compare the same graphics tests with and without DXC
        if: success() && matrix.app == 'filmcraft'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location -LiteralPath $env:VERIFY_SOURCE
          $executables = @(Get-ChildItem -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/deps') -Filter 'golden-*.exe')
          if ($executables.Count -ne 1) { throw 'Expected one exact golden integration-test binary' }
          $test = $executables[0].FullName
          $binaryDigest = (Get-FileHash -LiteralPath $test -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Location -LiteralPath (Join-Path $env:VERIFY_SOURCE 'crates/golden')
          $savedPath = $env:PATH
          try {
            $env:PATH = (($savedPath -split ';') | Where-Object { $_.TrimEnd('\','/') -ne $env:DXC_TOOL_DIR.TrimEnd('\','/') }) -join ';'
            & $test 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'shader-fxc.log')
            $withoutDxc = $LASTEXITCODE
          } finally {
            $env:PATH = $savedPath
          }
          & $test 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'shader-dxc.log')
          $withDxc = $LASTEXITCODE
          $oldLog = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'shader-fxc.log') -Raw
          [ordered]@{
            command = @($test)
            binarySHA256 = $binaryDigest
            sameBinaryAfterProbe = ((Get-FileHash -LiteralPath $test -Algorithm SHA256).Hash.ToLowerInvariant() -eq $binaryDigest)
            withoutDxcExitCode = $withoutDxc
            withDxcExitCode = $withDxc
            reproducedFxcFailure = ($withoutDxc -ne 0 -and $oldLog.Contains('FXC D3DCompile error'))
            changedSource = $false
            shaderCompilerRelease = $env:VERIFY_DXC_RELEASE
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'shader-probe.json')
          if ($withDxc -ne 0) { throw 'Graphics tests failed with maintained shader compiler' }
      - name: Retain exact verification output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ matrix.app }}
          path: |
            ${{ runner.temp }}/ci.log
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/shader-fxc.log
            ${{ runner.temp }}/shader-dxc.log
            ${{ runner.temp }}/shader-probe.json
          if-no-files-found: warn
          retention-days: 30
